<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Yumi slaví 1. narozeniny</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #FAF9F7;
  --card: #FFFFFF;
  --primary: #8FAEA0;
  --secondary: #F2C9B6;
  --text: #2F2F2F;
  --muted: #6B6B6B;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px;
  font-family: Inter, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.card {
  max-width: 440px;
  margin: auto;
  background: var(--card);
  padding: 32px 28px;
  border-radius: 18px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.06);
}

h1 {
  font-family: "Playfair Display", serif;
  font-weight: 600;
  text-align: center;
  margin: 0;
}

.subtitle {
  text-align: center;
  color: var(--muted);
  margin-top: 10px;
  font-size: 0.95rem;
}

.divider {
  width: 60px;
  height: 2px;
  background: var(--secondary);
  margin: 22px auto;
  border-radius: 2px;
}

label {
  display: block;
  margin-top: 18px;
  font-size: 0.9rem;
}

input, select, button {
  width: 100%;
  padding: 11px 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: 1px solid #d9d9d9;
  font-size: 1rem;
  font-family: inherit;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--primary);
}

.error {
  border-color: #dc2626;
  background: #fef2f2;
}

.choice {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 6px;
}

.choice button {
  background: white;
  color: var(--text);
  border: 1px solid #d9d9d9;
  cursor: pointer;
}

.choice button.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.submit {
  margin-top: 26px;
  background: var(--primary);
  color: white;
  border: none;
  cursor: pointer;
}

.submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.hidden {
  display: none;
}

#loading {
  text-align: center;
  margin-top: 14px;
  color: var(--muted);
}

#thankYou {
  text-align: center;
  animation: fadeIn 0.6s ease;
}

#thankYou h2 {
  font-family: "Playfair Display", serif;
  margin-bottom: 8px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="card">

  <h1>Yumi slaví 1. narozeniny</h1>
  <p class="subtitle">Budeme rádi, když s námi přijdete oslavit její první rok</p>
  <div class="divider"></div>

  <form id="form">

    <label>
      Jméno a příjmení
      <input type="text" id="name">
    </label>

    <label>
      Můžeme se na vás těšit?
      <div class="choice">
        <button type="button" data-value="ANO">ANO</button>
        <button type="button" data-value="NE">NE</button>
      </div>
    </label>

    <div id="counts" class="hidden">
      <label>Počet osob</label>
      <div class="row">
        <input type="number" id="adults" min="1" placeholder="Dospělí">
        <input type="number" id="children" min="0" placeholder="Děti">
      </div>
    </div>

    <button class="submit" id="submitBtn">Potvrdit účast</button>
    <div id="loading" class="hidden">Odesíláme odpověď…</div>

  </form>

  <div id="thankYou" class="hidden">
    <h2>Děkujeme 💛</h2>
    <p>Moc se na vás těšíme.</p>
  </div>

</div>

const adultsInput = document.getElementById("adults");

let attending = "";

document.querySelectorAll(".choice button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".choice button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    attending = btn.dataset.value;
    counts.classList.toggle("hidden", attending !== "ANO");
  });
});

function clearErrors() {
  [nameInput, adultsInput, childrenInput].forEach(el => el.classList.remove("error"));
}

function validate() {
  clearErrors();
  let ok = true;

  if (!nameInput.value.trim()) {
    nameInput.classList.add("error");
    ok = false;
  }

  if (!attending) ok = false;

  if (attending === "ANO") {
    if (adultsInput.value === "" || Number(adultsInput.value) < 1) {
      adultsInput.classList.add("error");
      ok = false;
    }
    if (childrenInput.value === "") {
      childrenInput.classList.add("error");
      ok = false;
    }
  }

  return ok;
}

</body>
</html>
